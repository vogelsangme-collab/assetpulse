<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AssetPulse PAM</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { min-height: 100vh; background: #faf8f4; color: #1c1917; font-family: 'Source Serif 4', Georgia, serif;
    display: flex; justify-content: center; padding: 56px 24px 28px; }
  a { color: #9a3412; }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
  .head { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .logo { min-width: 132px; height: 64px; display: flex; align-items: center; justify-content: center; }
  .mark { width: 64px; height: 64px; border-radius: 14px; background: #1c1917; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 30px; font-weight: 700; margin: 0; }
  .rule { height: 1px; background: #e7e2da; margin: 4px 0; }
  a.go { display: flex; align-items: center; justify-content: center; min-height: 54px; background: #1c1917; color: #fff;
    border-radius: 10px; font-size: 17px; font-weight: 600; text-decoration: none; }
  a.go:hover { filter: brightness(.94); color: #fff; }
  .spacer { flex: 1; }
  footer { display: flex; justify-content: space-between; font-size: 12px; color: #a8a29e; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <!-- Logo space: the app icon holds it until the company logo is supplied. -->
      <div class="logo"><div class="mark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.5c-3.5 4.2-6 7.6-6 11a6 6 0 0 0 12 0c0-3.4-2.5-6.8-6-11z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 13.5h2.6l1.2-2.6 1.6 4.4 1.1-2.1H16" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <h1>AssetPulse PAM</h1>
    </div>
    <div class="rule"></div>
    <a class="go" href="https://vogelsangme-collab.github.io/assetpulse/field.html">Open Field app</a>
    <div class="spacer"></div>
    <footer><span>Field app</span><span>v1.82</span></footer>
  </div>
</body>
</html>
